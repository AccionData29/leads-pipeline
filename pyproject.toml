[project]
name = "motos-leads-pipeline"
version = "0.1.0"
description = "End-to-end automated lead ingestion, normalization, deduplication, AI enrichment, scoring and assignment pipeline."
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2,<3",
  "numpy>=1.26,<3",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "SQLAlchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "scikit-learn>=1.5,<2",
  "rapidfuzz>=3.9,<4",
  "python-dotenv>=1.0,<2",
  "tenacity>=9,<10",
  "openai>=1.40,<3",
  "joblib>=1.4,<2",
  "pytest>=8,<9",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
leads-pipeline = "pipeline.main:main"

[tool.pytest.ini_options]
pythonpath = ["."]
