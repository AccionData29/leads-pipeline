name: leads-pipeline
on:
  workflow_dispatch:
  schedule:
    - cron: '0 11 * * *'
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e .
      - run: leads-pipeline --no-db
